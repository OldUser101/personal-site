[package]
name = "guestbook"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "fs", "macros", "net", "time"] }
tower = { version = "0.5.3", features = ["limit"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["tracing", "axum"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
